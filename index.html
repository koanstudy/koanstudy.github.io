        /* TUFTE CSS PHILOSOPHY 
           1. Content > Container
           2. Maximize Data-Ink Ratio
           3. Consistency: Everything is ET Book (Bembo)
        */

        /* RESET & BASE */
        html {
            font-size: 15px; /* Base size for Tufte scaling */
        }

        body {
            background-color: #fffff8; /* Tufte Cream */
            color: #111; /* Near-black ink */
            font-family: 'et-book', 'Palatino Linotype', 'Palatino', 'Georgia', serif;
            font-size: 1.4rem; /* Approx 21px reading size */
            line-height: 2rem;
            font-weight: 400;
            
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            
            /* Font smoothing for that 'printed' look */
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale;
        }

        /* LAYOUT: The 55-60 character column */
        article {
            width: 100%;
            max-width: 700px; /* Strict reading width */
            margin-bottom: 4rem;
        }

        /* TYPOGRAPHY: HEADERS */
        h1, h2, h3 {
            font-family: 'et-book', 'Palatino Linotype', 'Palatino', 'Georgia', serif;
            font-weight: 400;
            color: #111;
            margin-top: 2rem;
            margin-bottom: 1.4rem;
        }

        /* The Title */
        h1 {
            font-size: 3.2rem;
            line-height: 1;
            margin-top: 3rem;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em; /* Slight tightening for large serif */
        }
        
        /* The Link in the H1 needs to be invisible */
        h1 a {
            text-decoration: none;
            background: none;
            color: inherit;
            text-shadow: none;
        }

        /* H2: Major Section Heads */
        h2 {
            font-size: 2.2rem;
            font-style: italic;
            font-weight: 400;
            margin-top: 3.5rem;
            line-height: 1;
        }
        
        /* H3: Sub-sections (The Services) */
        h3 {
            font-size: 1.7rem;
            font-style: italic;
            margin-top: 2.5rem;
            margin-bottom: 0.5rem; /* Tighter to the text than H2 */
        }

        /* THE STRAPLINE / EPIGRAPH */
        .subtitle {
            font-family: 'et-book', serif;
            font-size: 1.4rem;
            font-style: italic; /* Tufte subtitles are almost always italic */
            display: block;
            margin-bottom: 4rem;
            color: #333;
        }
